name: SBOT Hosting - Manual 6 Hour Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbot-hosting-manual-test
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      YOUR_USERNAME: ${{ secrets.YOUR_USERNAME }}
      LOG_CHANNEL_ID: ${{ secrets.LOG_CHANNEL_ID }}
      PROOF_CHANNEL_ID: ${{ secrets.PROOF_CHANNEL_ID }}
      FORCE_JOIN_CHANNELS: ${{ secrets.FORCE_JOIN_CHANNELS }}
      START_IMAGE_URL: ${{ secrets.START_IMAGE_URL }}
      ACTION_IMAGE_URL: ${{ secrets.ACTION_IMAGE_URL }}
      BOT_USERNAME_LINK: ${{ secrets.BOT_USERNAME_LINK }}
      UPI_ID: ${{ secrets.UPI_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate bot syntax
        run: python -m py_compile bot.py

      - name: Check required Telegram token
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::error::Add BOT_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run bot for up to 6 hours
        run: timeout --signal=TERM 6h python -u bot.py
